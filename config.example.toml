# Zesty Backup configuration
#
# Copy this file to config.toml, fill in the [storage] and [backup] sections,
# and protect it:  chmod 600 config.toml   (it contains credentials)
#
# Only [storage] and [backup] are required. Everything else is optional.
# Lines starting with # are comments.

# ─────────────────────────────────────────────────────────────────────────────
# [storage]: where backups are uploaded
#
# Pick ONE provider. Ready-to-copy examples for every provider are in the
# README ("Storage providers" section). The fields each provider needs:
#
#   s3 / aws ........ bucket, region, access_key, secret_key (keys optional on AWS: IAM role / ~/.aws work too)
#   contabo, minio .. endpoint, bucket, access_key, secret_key
#   digitalocean .... region (e.g. "nyc3"), bucket, access_key, secret_key
#   wasabi .......... region (e.g. "eu-central-1"), bucket, access_key, secret_key
#   r2 .............. account_id, bucket, access_key, secret_key
#   gcs ............. bucket, credentials_path (or GOOGLE_APPLICATION_CREDENTIALS)
#   azure ........... account_name, account_key, bucket (= container name)
#   b2 .............. account_id (keyID), application_key, bucket (name)
#   googledrive, onedrive, dropbox, box .. refresh_token + client_id (+ client_secret), bucket_id (folder)
#   pcloud .......... access_key (OAuth token), region ("us" or "eu"), bucket_id (folder)
#   mega ............ bucket_id (folder); needs MEGAcmd installed
# ─────────────────────────────────────────────────────────────────────────────
[storage]
provider = "s3"
region = "us-east-1"
bucket = "your-bucket-name"
access_key = "your-access-key"
secret_key = "your-secret-key"
# endpoint = "https://..."   # only for S3-compatible services (not needed for AWS)

# ─────────────────────────────────────────────────────────────────────────────
# [backup]: what to back up and how long to keep it
# ─────────────────────────────────────────────────────────────────────────────
[backup]
# Where archives are written before upload.
local_backup_dir = "./backups"

# The main directory to back up. Stored in the archive as project/<folder name>/
project_path = "/path/to/your/project"

# Extra files or directories. Stored as system/<name>
additional_paths = [
    # "/etc/nginx/nginx.conf",
]

# Skip these. A name or glob without "/" matches at any depth
# ("node_modules", "*.log", ".git"); a pattern with "/" matches a path
# relative to the directory being backed up ("storage/cache/*").
exclude = [
    # "node_modules",
    # ".git",
    # "*.log",
]

# Delete backups older than this many days (local and remote) when running
# `zesty-backup clean` or the daemon. The newest backup is always kept.
# For daily/weekly/monthly/yearly retention instead, see [retention] below.
retention_days = 7

# zstd compression level, 1 (fastest) to 22 (smallest). 3 is a good default.
compression_level = 3

# Daemon schedule (can be overridden with --backup-interval / --upload-interval):
incremental_per_day = 4     # backups per day -> one every 24/4 = 6 hours
upload_interval_hours = 24  # upload new backups (then clean old ones) every 24 hours

# ─────────────────────────────────────────────────────────────────────────────
# [database]: optional database dump, stored in the archive under database/
# Supported types: postgres, mysql, mariadb, mongodb, redis, sqlite,
#                  cassandra / scylla (schema only)
# The matching tool must be installed (pg_dump, mysqldump, mongodump, ...).
# ─────────────────────────────────────────────────────────────────────────────
[database]
enabled = false
# type = "postgres"
# host = "localhost"
# port = 5432
# database = "your_database"       # for sqlite: path to the .db file
# username = "your_user"
# password = "your_password"       # or the DB_PASSWORD env var, or DATABASE_URL in <project_path>/.env

# ─────────────────────────────────────────────────────────────────────────────
# [system]: optional system files and command outputs
# ─────────────────────────────────────────────────────────────────────────────
[system]
# Unit files from /etc/systemd/system/
systemd_services = [
    # "myapp.service",
]
systemd_timers = [
    # "myapp-cleanup.timer",
]

# Save the output of commands as text files (under commands/ in the archive).
command_outputs = [
    # { command = "docker", args = ["ps", "-a"], output_file = "docker_containers.txt" },
    # { command = "dpkg", args = ["-l"], output_file = "packages.txt", enabled = false },
]

[system.presets]
# /etc/nginx/nginx.conf plus sites-available/ and sites-enabled/
nginx_enabled = false
# ...or only some sites (used when nginx_enabled = false)
nginx_sites = [
    # "example.com",
]

# Output of `crontab -l`
crontab_enabled = false
# crontab_user = "www-data"        # default: the user running zesty-backup

# Dotfiles from a home directory (stored under user-configs/)
user_configs = [
    # ".bashrc",
    # ".gitconfig",
]
# user_configs_home = "/home/someone"   # default: $HOME

# Files and directories under /etc (stored under etc/)
etc_files = [
    # "hosts",
    # "fstab",
]
etc_dirs = [
    # "letsencrypt",
]

# ─────────────────────────────────────────────────────────────────────────────
# [encryption]: optional. Encrypts archives with age (https://age-encryption.org)
# before they are written, so neither the disk nor the cloud sees plain data.
# Encrypted archives end in .tar.zst.age.
#
# Recommended: a public key. Create a key pair on a machine you trust with
#   age-keygen -o zesty-key.txt
# put the printed public key (age1…) below, and keep zesty-key.txt somewhere
# safe and OFF this server. Without it, the backups cannot be restored.
# ─────────────────────────────────────────────────────────────────────────────
# [encryption]
# recipients = ["age1..."]        # one or more public keys
# passphrase = "..."              # or instead a passphrase (better: the ZESTY_BACKUP_PASSPHRASE env var)
# identity_file = "/path/key.txt" # private key, only needed where you run restore/verify

# ─────────────────────────────────────────────────────────────────────────────
# [drill]: optional. What `zesty-backup drill` checks after restoring the latest
# backup into a temporary folder. Paths are as stored in the archive
# (project/<folder>/..., system/..., database/...).
# Database restore tests need Docker (postgres, mysql, mariadb).
# ─────────────────────────────────────────────────────────────────────────────
# [drill]
# max_age_hours = 26                        # fail if the newest backup is older
# files = ["project/myapp/.env"]            # globs; each must match at least one file
# database_checks = ["SELECT count(*) > 0 FROM users"]   # must not return empty/0/false
# commands = [{ name = "smoke test", run = "test -s project/myapp/.env" }]
# interval_hours = 168                      # let the daemon run a drill weekly
# database_restore = true                   # load the dump into a throwaway container
# database_image = "postgres:16-alpine"     # default: picked from the dump's server version
# container_runtime = "docker"              # or "podman"
# work_dir = "/var/tmp"                     # needs room for one backup + its contents

# ─────────────────────────────────────────────────────────────────────────────
# [retention]: optional. Keep the newest backup of each of the last N days,
# weeks, months and years instead of "everything from the last N days".
# When present, it replaces [backup] retention_days.
# ─────────────────────────────────────────────────────────────────────────────
# [retention]
# keep_daily = 7
# keep_weekly = 4
# keep_monthly = 12
# keep_yearly = 3
# keep_last = 1              # always keep the N newest
# keep_within_days = 2       # plus everything from the last N days

# ─────────────────────────────────────────────────────────────────────────────
# [anomaly]: optional, ON by default. Each new backup is compared with the
# previous ones; a sudden drop in size, file count or database dump size, or
# data that stops compressing (ransomware), raises an alert and pauses
# retention until you run `zesty-backup accept-changes`.
# ─────────────────────────────────────────────────────────────────────────────
# [anomaly]
# size_drop_percent = 50
# files_drop_percent = 50
# database_drop_percent = 50
# incompressible_ratio = 0.9
# pause_retention = true
# enabled = false

# ─────────────────────────────────────────────────────────────────────────────
# [alerts]: optional. Get told when something fails (and notice when backups
# silently stop). Test with: zesty-backup test-alerts
# ─────────────────────────────────────────────────────────────────────────────
# [alerts]
# healthchecks_url = "https://hc-ping.com/your-uuid"   # pinged on success, /fail on failure
# healthchecks_drill_url = "https://hc-ping.com/other" # optional separate check for drills
# ntfy_url = "https://ntfy.sh/my-secret-topic"          # push notifications
# ntfy_token = "tk_..."                                 # for protected ntfy topics
# webhook_url = "https://hooks.slack.com/services/..."  # Slack, Discord or any JSON endpoint
# notify_success = false                                # true: also notify successes
# server_name = "web-1"                                 # default: hostname

# ─────────────────────────────────────────────────────────────────────────────
# [logging]: optional
# ─────────────────────────────────────────────────────────────────────────────
[logging]
level = "info"        # trace, debug, info, warn, error (RUST_LOG overrides this)
log_dir = "./logs"    # also write logs to <log_dir>/zesty-backup.log (read with `zesty-backup logs`)
