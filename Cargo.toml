[package]
name = "zesty-backup"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
description = "A flexible, multi-provider backup utility for cloud storage"
license = "MIT"
repository = "https://github.com/rc-basilisk/zesty_backup"
homepage = "https://github.com/rc-basilisk/zesty_backup"
authors = ["Basilisk <admin@zetsubou.life>"]
keywords = ["backup", "cloud-storage", "s3", "encryption", "backup-utility"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    "config.toml",
    "*.toml.local",
    "backups/",
    "logs/",
    "restored/",
    ".env",
    ".env.local",
]

[[bin]]
name = "zesty-backup"
path = "src/main.rs"

[lib]
name = "zesty_backup"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
aws-sdk-s3 = { version = "1.20", features = ["behavior-version-latest"] }
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-credential-types = "1.2.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tar = "0.4"
walkdir = "2.4"
globset = "0.4"
futures = "0.3"
zstd = "0.13"
tempfile = "3.8"
async-trait = "0.1"
url = "2.5"
which = "5.0"
bytes = "1"
# HTTP client for the REST-based providers (B2, Google Drive, OneDrive, Dropbox, Box, pCloud).
# Same major version as the one object_store already pulls in, and rustls so no system OpenSSL is needed.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
base64 = "0.22"
sha1 = "0.10"
# Google Cloud Storage and Azure Blob Storage
object_store = { version = "0.12", features = ["gcp", "azure"] }
age = { version = "0.12", features = ["armor"] }
