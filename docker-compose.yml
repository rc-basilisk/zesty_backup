services:
  zesty-backup:
    build: .
    image: zesty-backup:latest
    container_name: zesty-backup
    restart: unless-stopped
    volumes:
      - ./config:/app/config          # config.toml goes here (writable if you use token_cache)
      - ./backups:/app/backups        # set local_backup_dir = "/app/backups"
      - ./logs:/app/logs              # set log_dir = "/app/logs"
      - /path/to/your/project:/data:ro  # what to back up: set project_path = "/data"
    environment:
      - ZESTY_BACKUP_CONFIG=/app/config/config.toml
      # - GOOGLE_APPLICATION_CREDENTIALS=/app/config/gcs-key.json
      # - AZURE_STORAGE_ACCOUNT_KEY=...
      # - DB_PASSWORD=...
    command: daemon
