name: Release

# Push a tag like v2.0.0 to build the binaries and publish a GitHub release,
# or run it manually ("Run workflow") with the tag to create.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v2.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: zesty-backup
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: zesty-backup.exe
            archive_format: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: zesty-backup
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: zesty-backup
            archive_format: tar.gz
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} --verbose
      
      - name: Create archive (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} release/
          tar czf zesty-backup-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_format }} -C release ${{ matrix.bin_name }}
      
      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir release
          copy target\${{ matrix.target }}\release\${{ matrix.bin_name }} release\
          powershell Compress-Archive -Path release\${{ matrix.bin_name }} -DestinationPath zesty-backup-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip -Force
      
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: zesty-backup-${{ matrix.target }}
          path: zesty-backup-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_format }}

  publish:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
