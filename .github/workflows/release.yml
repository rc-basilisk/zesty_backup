name: Release

# Publishes a GitHub release with prebuilt binaries:
#  - automatically on pushes to main, when the tag v<version> (version from
#    Cargo.toml) does not exist yet: bump the version to release, or
#  - when a tag like v2.0.0 is pushed, or
#  - manually ("Run workflow"), with the tag to create.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v2.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Decide release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already released, nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build Release Binaries
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: zesty-backup
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: zesty-backup.exe
            archive_format: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: zesty-backup
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: zesty-backup
            archive_format: tar.gz
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} --verbose
      
      - name: Create archive (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} release/
          tar czf zesty-backup-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_format }} -C release ${{ matrix.bin_name }}
      
      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir release
          copy target\${{ matrix.target }}\release\${{ matrix.bin_name }} release\
          powershell Compress-Archive -Path release\${{ matrix.bin_name }} -DestinationPath zesty-backup-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip -Force
      
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: zesty-backup-${{ matrix.target }}
          path: zesty-backup-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_format }}

  publish:
    name: Publish GitHub Release
    needs: [check, build-release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
